name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      h5_url:
        description: 'H5 域名地址 (留空则默认使用 capacitor.config.ts 中的地址)'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Override H5 URL if provided
        if: ${{ inputs.h5_url != '' }}
        run: |
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('capacitor.config.ts', 'utf8');
            content = content.replace(/url:\s*['\"].*?['\"]/, \"url: '${{ inputs.h5_url }}'\");
            fs.writeFileSync('capacitor.config.ts', content);
            console.log('Overrode H5 URL to: ${{ inputs.h5_url }}');
          "

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
