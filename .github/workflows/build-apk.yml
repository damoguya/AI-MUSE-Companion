name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      h5_url:
        description: 'H5 域名地址 (留空则默认使用 capacitor.config.ts 中的地址)'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Override H5 URL if provided
        if: ${{ inputs.h5_url != '' }}
        run: |
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('capacitor.config.ts', 'utf8');
            content = content.replace(/url:\s*['\"].*?['\"]/, \"url: '${{ inputs.h5_url }}'\");
            fs.writeFileSync('capacitor.config.ts', content);
            console.log('Overrode H5 URL to: ${{ inputs.h5_url }}');
          "

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Restore AIMUSE Custom Icons and App Name
        run: |
          RES=android/app/src/main/res
          SRC=$RES/drawable/ic_launcher_foreground.png

          # 安装 ImageMagick（Ubuntu 自带，通常无需安装）
          which convert || sudo apt-get install -y imagemagick

          # 用 1024px 源图缩放生成全分辨率图标
          convert $SRC -resize 48x48   $RES/mipmap-mdpi/ic_launcher.png
          convert $SRC -resize 48x48   $RES/mipmap-mdpi/ic_launcher_round.png
          convert $SRC -resize 72x72   $RES/mipmap-hdpi/ic_launcher.png
          convert $SRC -resize 72x72   $RES/mipmap-hdpi/ic_launcher_round.png
          convert $SRC -resize 96x96   $RES/mipmap-xhdpi/ic_launcher.png
          convert $SRC -resize 96x96   $RES/mipmap-xhdpi/ic_launcher_round.png
          convert $SRC -resize 144x144 $RES/mipmap-xxhdpi/ic_launcher.png
          convert $SRC -resize 144x144 $RES/mipmap-xxhdpi/ic_launcher_round.png
          convert $SRC -resize 192x192 $RES/mipmap-xxxhdpi/ic_launcher.png
          convert $SRC -resize 192x192 $RES/mipmap-xxxhdpi/ic_launcher_round.png

          # 强制写入正确的应用名称（防止 cap sync 覆盖）
          printf '%s\n' "<?xml version='1.0' encoding='utf-8'?>" "<resources>" '    <string name="app_name">AIMUSE</string>' '    <string name="title_activity_main">AIMUSE</string>' '    <string name="package_name">com.aimuse.companion</string>' '    <string name="custom_url_scheme">com.aimuse.companion</string>' "</resources>" > $RES/values/strings.xml
          echo "Custom icons and app name restored successfully."

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
